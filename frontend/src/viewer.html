<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FasterLivePortrait</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: #000;
            }
            canvas {
                width: 100%;
                height: 100%;
                display: block;
            }
            #connectionStatus {
                position: fixed;
                bottom: 10px;
                left: 10px;
                color: rgba(255, 255, 255, 0.7);
                font-family: Arial, sans-serif;
                font-size: 14px;
                padding: 5px;
                background-color: rgba(0, 0, 0, 0.5);
                border-radius: 4px;
                z-index: 100;
                opacity: 1;
                transition: opacity 1s;
            }
            #connectionStatus.fade {
                opacity: 0;
            }
            #sessionInput {
                position: fixed;
                display: none;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background-color: rgba(0, 0, 0, 0.8);
                padding: 20px;
                border-radius: 8px;
                color: white;
                z-index: 200;
            }
            #sessionInput input {
                width: 100%;
                padding: 8px;
                margin: 10px 0;
                border-radius: 4px;
                border: none;
            }
            #sessionInput button {
                background-color: #3498db;
                color: white;
                border: none;
                padding: 10px 15px;
                border-radius: 4px;
                cursor: pointer;
                margin-top: 10px;
                width: 100%;
            }
            #motalContainer {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 150;
                opacity: 0;
                transition: opacity 500ms ease;
                pointer-events: none;
                display: none;
            }
            #motalContainer.visible {
                opacity: 1;
                display: block;
            }
            #motalVideo {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
        </style>
    </head>
    <body>
        <div id="sessionInput">
            <h2>Connect to Stream</h2>
            <input
                type="text"
                id="sessionIdInput"
                placeholder="Enter session ID"
                value="performer1"
            />
            <button id="connectButton">Connect</button>
        </div>

        <div id="connectionStatus">Waiting for connection...</div>

        <div id="motalContainer">
            <video
                id="motalVideo"
                src="/frontend/images/motal-silhouette-1_1.mp4"
                muted
                playsinline
                loop
            ></video>
        </div>

        <script type="module">
            import {
                setupWebSocketHandler,
                getAnimationIntensity,
            } from "./js/websocket-handler.js";
            // Make these available to main.js
            window.setupWebSocketHandler = setupWebSocketHandler;
            window.getAnimationIntensity = getAnimationIntensity;

            // Motal video handling
            let motalEnabled = false;
            const motalContainer = document.getElementById("motalContainer");
            const motalVideo = document.getElementById("motalVideo");
            
            console.log("Motal elements initialized:", {
                container: motalContainer, 
                video: motalVideo,
                videoSrc: motalVideo.src
            });
            
            // Verify video can be loaded
            motalVideo.addEventListener('error', (e) => {
                console.error("Error loading motal video:", e);
            });
            
            motalVideo.addEventListener('loadeddata', () => {
                console.log("Motal video loaded successfully");
            });

            // Listen for motal state changes
            console.log("Setting up websocket:set_motal event listener");
            document.addEventListener("websocket:set_motal", (e) => {
                console.log("Received set_motal event:", e.detail);
                const newState = e.detail.motalEnabled;

                if (newState !== motalEnabled) {
                    motalEnabled = newState;

                    if (motalEnabled) {
                        // Show Motal video
                        console.log("Showing Motal video");
                        // Reset video to beginning
                        motalVideo.currentTime = 0;
                        // Start the video playing
                        motalVideo.play().catch(err => console.error("Error playing video:", err));
                        // Ensure we're visible but transparent before starting the fade in
                        motalContainer.style.display = "block";
                        // Force a reflow to ensure the display change is processed
                        void motalContainer.offsetWidth;
                        // Now trigger the fade in
                        motalContainer.classList.add("visible");
                    } else {
                        // Hide Motal video with transition
                        console.log("Hiding Motal video");
                        motalContainer.classList.remove("visible");
                        // Wait for transition to complete before hiding
                        setTimeout(() => {
                            motalContainer.style.display = "none";
                            motalVideo.pause();
                        }, 500);
                    }

                    console.log("Motal state changed to:", motalEnabled);
                }
            });
        </script>
        <script type="module" src="./main.js"></script>
    </body>
</html>
