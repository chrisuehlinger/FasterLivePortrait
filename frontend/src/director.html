<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FasterLivePortrait - Actor Streaming</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
            margin: 0 auto;
            position: fixed;
            width: 100vw;
            height: 100vh;

        }

        .container {
            display: flex;
            flex-wrap: wrap;
            background-color: #f0f0f0;
            height: 80vh;
        }
        button {
          flex-basis: 50%;
          font-size: 128px;
          color: white;
        }
        
        .controls-row {
            display: flex;
            width: 100%;
            height: 10vh;
            background-color: #333;
        }
        
        .pause-button {
            flex-basis: 100%;
            height: 10vh;
            width: 100vw;
            font-size: 48px;
            background-color: #555;
            border: none;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .pause-button.paused {
            background-color: #f44336;
        }
        
        .intensity-control {
            display: flex;
            width: 100%;
            height: 10vh;
            background-color: #222;
            padding: 10px;
            align-items: center;
            color: white;
        }
        
        .intensity-slider {
            flex-grow: 1;
            margin: 0 20px;
            height: 30px;
        }
        
        .intensity-value {
            width: 60px;
            text-align: center;
            font-size: 24px;
        }
        
        .intensity-label {
            font-size: 24px;
            width: 180px;
        }
    </style>
</head>
<body>

  <div class="container">
    <button id="ahaukin" style="background-color: goldenrod;" onclick="sendCommand(0)">AHAU-KIN</button>
    <button id="ixchel" style="background-color: blue;" onclick="sendCommand(1)">IX-CHEL</button>
    <button id="chacbolay" style="background-color: red;" onclick="sendCommand(2)">CHAC-BOLAY</button>
    <button id="off" style="background-color: black;" onclick="sendCommand(3)">OFF</button>
  </div>
  
  <div class="intensity-control">
    <div class="intensity-label">INTENSITY:</div>
    <input type="range" id="intensitySlider" class="intensity-slider" min="0" max="100" value="100" step="1" value="0">
    <div id="intensityValue" class="intensity-value">0.0</div>
  </div>
  
  <div class="controls-row">
    <button id="pauseButton" class="pause-button" onclick="togglePause()">PAUSE ANIMATION</button>
  </div>

    <script>
        // Configuration
        const SERVER_URL = window.location.hostname + ":" + window.location.port;
        const USE_SSL = window.location.protocol === 'https:';
        const API_URL = `${USE_SSL ? 'https' : 'http'}://${SERVER_URL}`;
        const WS_URL = `${USE_SSL ? 'wss' : 'ws'}://${SERVER_URL}`;
        
        // Session ID (fixed for this app)
        const SESSION_ID = 'performer1';
        
        // WebSocket connection for director
        let socket;
        let reconnectTimer = null;
        let heartbeatInterval = null;

        const buttons = {
            ahaukin: document.getElementById('ahaukin'),
            ixchel: document.getElementById('ixchel'),
            chacbolay: document.getElementById('chacbolay'),
            off: document.getElementById('off')
        };
        
        // Pause state tracking
        let isPaused = false;
        const pauseButton = document.getElementById('pauseButton');
        
        // Intensity control elements
        const intensitySlider = document.getElementById('intensitySlider');
        const intensityValue = document.getElementById('intensityValue');

        function sendCommand(index) {
            fetch(`${API_URL}/switch_source/performer1/${index}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ index: index })
            })
            .then(response => response.json())
            .then(data => console.log('Success:', data))
            .catch((error) => console.error('Error:', error));
        }
        
        function togglePause() {
            isPaused = !isPaused;
            
            // Update button appearance
            if (isPaused) {
                pauseButton.textContent = "RESUME ANIMATION";
                pauseButton.classList.add('paused');
            } else {
                pauseButton.textContent = "PAUSE ANIMATION";
                pauseButton.classList.remove('paused');
            }
            
            // Send command to server
            fetch(`${API_URL}/toggle_pause/performer1`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ paused: isPaused })
            })
            .then(response => response.json())
            .then(data => console.log('Pause state changed:', data))
            .catch((error) => console.error('Error toggling pause:', error));
        }
        
        // Initialize WebSocket connection
        function connectWebSocket() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                return;
            }
            
            console.log(`Connecting to WebSocket at ${WS_URL}/ws/director/${SESSION_ID}`);
            socket = new WebSocket(`${WS_URL}/ws/director/${SESSION_ID}`);
            
            socket.onopen = function() {
                console.log('WebSocket connected');
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                
                // Start heartbeat to keep connection alive
                if (heartbeatInterval) {
                    clearInterval(heartbeatInterval);
                }
                heartbeatInterval = setInterval(() => {
                    if (socket.readyState === WebSocket.OPEN) {
                        socket.send("heartbeat");
                    }
                }, 30000); // 30 seconds
            };
            
            socket.onclose = function() {
                console.log('WebSocket disconnected');
                if (heartbeatInterval) {
                    clearInterval(heartbeatInterval);
                    heartbeatInterval = null;
                }
                
                // Try to reconnect after 3 seconds
                if (!reconnectTimer) {
                    reconnectTimer = setTimeout(connectWebSocket, 3000);
                }
            };
            
            socket.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
            
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    console.log('Received WebSocket message:', data);
                    
                    // Handle intensity updates from other clients
                    if (data.action === 'intensity_update' && data.initiator !== 'director') {
                        const intensity = parseFloat(data.value);
                        intensitySlider.value = Math.round(intensity * 100);
                        intensityValue.textContent = intensity.toFixed(1);
                    }
                } catch (e) {
                    console.error('Error parsing WebSocket message:', e);
                }
            };
        }
        
        // Send intensity update over WebSocket
        function sendIntensityUpdate(value) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    action: 'intensity_update',
                    value: value,
                    initiator: 'director'
                }));
            }
        }
        
        // Initialize intensity slider
        intensitySlider.addEventListener('input', function() {
            const intensity = this.value / 100;
            intensityValue.textContent = intensity.toFixed(1);
            sendIntensityUpdate(intensity);
        });
        
        // Connect WebSocket on page load
        window.addEventListener('load', connectWebSocket);
    </script>
</body>
</html>
